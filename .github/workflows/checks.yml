name: Checks

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:
  merge_group:
    types:
      - checks_requested

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install and build dependencies
        run: |
          pnpm install --frozen-lockfile --filter tsover
          pnpm --filter tsover run patch
          pnpm install --frozen-lockfile

      - name: Build everything
        run: pnpm run -r build

      - name: Test
        run: pnpm run test
